[package]
name = "rivet-aac"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-aac"
homepage = "https://github.com/safewords/rivet-aac"
documentation = "https://docs.rs/rivet-aac"
authors = ["Ely Erin Fox"]
description = "An AAC-LC, HE-AAC and HE-AAC v2 (SBR, parametric stereo) encoder and decoder in Rust, written from ISO/IEC 13818-7 and 14496-3: no C, no system libraries, no build script. ADTS, raw access units and the AudioSpecificConfig; mono to 7.1 and program_config_element layouts. rivet's AAC codec. Imported as `aac`."
keywords = ["aac", "audio", "decoder", "encoder", "codec"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/", "docs/", "fuzz/", "tools/"]

[lib]
name = "aac"

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
# Compiles out the AVX2 copies of the vectorised kernels (the portable ones
# give bit-identical results); CI tests this path too.
force-scalar = []

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, but nothing here tests it there.

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests
        run: cargo test --release
      # The portable kernels alone (the run-time AVX2 copies compiled out); they
      # give bit-identical results, so every test must pass unchanged.
      - name: Tests (force-scalar)
        run: cargo test --release --features force-scalar
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz

  # The decoder is checked against an independent implementation, used only
  # as a black box: faad2's `faad` decodes the committed fdk-aac streams and
  # this crate's encoder output, and the PCM is compared. Without faad on
  # PATH those tests skip, so this job installs it and makes a skip a failure.
  oracle:
    name: tests against faad2 (black box)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends faad
      - name: Tests
        run: cargo test --release
        env:
          AAC_REQUIRE_FAAD: "1"

  # The AAC-LC, HE-AAC and HE-AAC v2 decoder against the ISO/IEC 14496-26
  # conformance streams and reference waveforms, as data: fetched from ISO's
  # electronic inserts (only the members the test reads) and compared.
  conformance:
    name: ISO/IEC 14496-26 conformance streams (AAC-LC, HE-AAC, HE-AAC v2)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: conformance
          key: iso-14496-26-ed2-${{ hashFiles('tools/fetch_conformance.py') }}
      - run: python3 tools/fetch_conformance.py conformance
      - name: Conformance
        run: cargo test --release --test conformance -- --nocapture
        env:
          AAC_CONFORMANCE_DIR: conformance
          AAC_REQUIRE_CONFORMANCE: "1"
      - name: Conformance (force-scalar)
        run: cargo test --release --features force-scalar --test conformance
        env:
          AAC_CONFORMANCE_DIR: conformance
          AAC_REQUIRE_CONFORMANCE: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features force-scalar -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-aac
      submodule: crates/aac
